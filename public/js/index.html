<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio - Giovanny Mendoza Villamizar</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Fuente moderna de Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Sección Hero -->
    <header id="hero">
      <!-- Contenedor para las partículas -->
      <div id="particles-js"></div>

      <!-- Contenido del texto -->
      <div class="hero-content">
        <h1>
          Hola, soy <span class="highlight">Giovanny Mendoza Villamizar</span>
        </h1>
        <p>Desarrollador Full Stack & Creativo</p>
        <a href="https://giovanymevi.github.io/giovanny.dev/" class="btn"
          >Ver Proyectos</a
        >
      </div>
    </header>

    <!-- Sección Proyectos -->
    <section id="proyectos">
      <!-- Contenedor para las partículas -->
      <div id="particles-proyectos"></div>

      <div class="proyectos-content">
        <h2>Mis Proyectos</h2>
        <div class="gallery">
          <div class="project-card">
            <a href="https://reposi-eight.vercel.app" target="_blank">
              <img
                src="/public/img/x.jpg"
                alt="Proyecto Reposi"
              />
              <h3>Reposi App</h3>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Scripts -->
    <!-- Librería Particles.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <!-- Configuración de partículas -->
    <script src="js/app.js"></script>
  </body>
</html>
