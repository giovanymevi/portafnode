<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio - Giovanny Mendoza Villamizar</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Fuente moderna de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Sección Hero -->
    <header id="hero">
        <!-- Contenedor para las partículas -->
        <div id="particles-js"></div>
        
        <!-- Contenido del texto -->
        <div class="hero-content">
            <h1>Hola, soy <span class="highlight">Giovanny Mendoza Villamizar</span></h1>
            <p>Desarrollador Full Stack & Creativo</p>
            <a href="#proyectos" class="btn">Ver Proyectos</a>
        </div>
    </header>

    <!-- Sección de relleno para demostración -->
    <section id="proyectos" style="height: 100vh; padding: 50px; background: #f4f4f4;">
        <h2>Mis Proyectos</h2>
        <p>Aquí iría la galería de tus trabajos...</p>
    </section>

    <!-- Scripts -->
    <!-- Librería Particles.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <!-- Configuración de partículas -->
    <script src="js/app.js"></script>
</body>
</html>
